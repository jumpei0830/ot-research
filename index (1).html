howModal()};dialog.querySelector('[data-close]').onclick=()=>{dialog.close();button.focus()};dialog.querySelector('[data-copy]').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);dialog.querySelector('[role=status]').textContent='URLをコピーしました。Safariに貼り付けてください。'}catch(e){dialog.querySelector('input').focus();dialog.querySelector('input').select();dialog.querySelector('[role=status]').textContent='URLを長押ししてコピーしてください。'}}})();</script></body></html>
